# ============================================================
# btop 配置（下发到 ~/.config/btop/btop.conf）
# 省略项使用 btop 1.4.x 内置默认值；运行中修改会写回本文件
# ============================================================

# Catppuccin Mocha 主题（与 kitty 配色一致）
color_theme = "catppuccin_mocha"

# 使用终端背景（kitty 已设置 0.95 透明度）
theme_background = false

truecolor = true
vim_keys = true
proc_tree = true
proc_filter_kernel = true
update_ms = 2000
