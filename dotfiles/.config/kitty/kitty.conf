# ============================================================
# kitty 配置文件 (Catppuccin Mocha 主题)
# ============================================================

# ---------- 外观: 颜色 (Catppuccin Mocha) ----------
background            #1e1e2e
foreground            #cdd6f4
selection_background  #585b70
selection_foreground  #cdd6f4

url_color             #89b4fa

# cursor
cursor                #f5e0dc
cursor_text_color     #1e1e2e

# 普通色
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de

# 亮色
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# ---------- 外观: 字体 ----------
font_family      JetBrains Maple Mono
bold_font        JetBrains Maple Mono
italic_font      JetBrains Maple Mono
bold_italic_font JetBrains Maple Mono
font_size        14.0

# ---------- 外观: 界面 ----------
# 背景透明度 (0~1, 1为不透明)
background_opacity 0.95
# 背景模糊
background_blur    0
# 窗口内边距 (pts; 文本与窗口边框之间的留白, 单值 = 四边一致)
window_padding_width 4

# 光标样式: 块状闪烁
cursor_shape          block
cursor_blink_interval 0.8

# ---------- 行为 ----------
# 响铃
bell_on_tab              yes
mouse_hide_wait          2.0

# 滚动
scrollback_lines         10000

# 复制粘贴快捷键 (Ctrl+Shift+C/V 已默认, 保持)
# 鼠标右键粘贴 (先抑制右键菜单, 再映射点击粘贴; grabbed 使 tmux/vim 内同样生效)
mouse_map right press grabbed,ungrabbed no-op
mouse_map right click grabbed,ungrabbed paste_from_clipboard
# ---------- 链接: Ctrl+点击打开 ----------
# press 事件: 按下立即触发, 不受 click_interval / 鼠标轻微移动影响 (修复"点好几次才打开")
# grabbed+ungrabbed: tmux/vim/less 等抓取鼠标的程序内同样生效 (修复"在 tmux 里点了没反应")
# 用 mouse_click_url 而非 mouse_click_url_or_select: 已有选区时也直接打开, 无需先点一下清空选区
mouse_map ctrl+left press ungrabbed,grabbed mouse_click_url

# ---------- 快捷键 ----------
# 切换标签页
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab

# 放大/缩小字体
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# ---------- 分屏 ----------
# 布局: splits 置于首位, 作为启动布局。
# 注意: 默认启动布局是 fat, 该布局下 vsplit/hsplit 无区别 (都按布局顺序排),
# 只有 splits 布局才区分 vsplit(左右) 与 hsplit(上下)。
enabled_layouts splits, fat, grid, stack, tall, vertical, horizontal
# 左右分屏
map ctrl+shift+enter launch --location=vsplit --cwd=current
# 上下分屏
map ctrl+shift+e     launch --location=hsplit --cwd=current
# 切换当前分屏方向
map ctrl+shift+r     layout_action rotate

# ---------- 广播 ----------
# 启动广播: 输入会实时发送到所有窗口, Ctrl+Esc 结束
map ctrl+shift+b     launch --allow-remote-control kitty +kitten broadcast
