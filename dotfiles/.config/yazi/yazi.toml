# ============================================================
# yazi 配置（下发到 ~/.config/yazi/yazi.toml）
# 省略项使用 yazi 内置默认值
# ============================================================

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size      = 2
image_filter  = "triangle"
image_quality = 90

[input]
cursor_blink = true
