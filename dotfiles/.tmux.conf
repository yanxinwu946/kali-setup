# 基础
set -g history-limit 100000
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g mouse on

# 分屏（prefix + h/v）
unbind '"'
unbind %
bind h split-window -v
bind v split-window -h

# Alt + 方向键切换 pane；Alt + 数字切换 window
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# 同步输入 / 调整 pane 大小 / 交换 pane
bind g set-window-option synchronize-panes\; display-message "synchronize-panes: #{?pane_synchronized,on,off}"
bind -n M-S-Left resize-pane -L
bind -n M-S-Right resize-pane -R
bind -n M-S-Up resize-pane -U
bind -n M-S-Down resize-pane -D
unbind-key '{'
unbind-key '}'
bind-key S-Up swap-pane -U
bind-key S-Down swap-pane -D

# 布局
bind l select-layout main-vertical
bind V select-layout even-vertical
bind H select-layout even-horizontal

# 状态栏
set -g status-style bg=color234,fg=color244
set -g status-left ''
set -g status-right '#H [#{session_name}]'
set -g status-right-length 200
set -g window-status-format '#{window_index}'
set -g window-status-current-format '#[bold,fg=white]#{window_index}'
set -g pane-active-border-style fg=cyan

# vi 模式复制到系统剪贴板
setw -g mode-keys vi
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \
    "xclip -selection primary -filter | xclip -selection clipboard"

# 重载配置 / 切换鼠标
bind r source-file ~/.tmux.conf\; display-message "tmux config reloaded"
bind m set-option -g mouse\; display-message "mouse: #{?mouse,on,off}"
